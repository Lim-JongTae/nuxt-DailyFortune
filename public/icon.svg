<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0F1226"/>
  
  <!-- Ambient Inner Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFDE9E" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="12 16" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E8C170" stroke-width="8" stroke-opacity="0.4" />

  <!-- Yin Yang / Celestial Seal Center Circle -->
  <circle cx="256" cy="256" r="130" fill="#1B1F3B" stroke="#FFDF9E" stroke-width="4" />

  <!-- Star Sparkle ✦ -->
  <path d="M256 160 L272 240 L352 256 L272 272 L256 352 L240 272 L160 256 L240 240 Z" fill="url(#goldGradient)" />

  <!-- Vermilion Seal Square Stamp at Center Right -->
  <rect x="290" y="290" width="80" height="80" rx="16" fill="#C83B2B" stroke="#FFDE9E" stroke-width="3" />
  <text x="330" y="344" text-anchor="middle" font-family="serif, 'Noto Serif KR'" font-size="40" font-weight="bold" fill="#FFFFFF">命</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="50%" stop-color="#FFDF9E" />
      <stop offset="100%" stop-color="#D49E35" />
    </linearGradient>
  </defs>
</svg>
